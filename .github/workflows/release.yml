---
name: Creating Release of latest AirConnect binaries
on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Lets upstream-check.yml invoke this workflow directly in the same run,
  # after it pushes a new tag - a tag pushed with the default GITHUB_TOKEN
  # does NOT trigger other workflows' `on: push: tags` (GitHub suppresses
  # that to prevent recursive runs), so relying on the push trigger alone
  # would silently never publish anything. release_tag lets the caller say
  # "this run IS a release, for this tag" explicitly instead.
  workflow_call:
    inputs:
      release_tag:
        description: "Treat this run as a release for this tag (used by upstream-check.yml)"
        required: false
        type: string

permissions:
  contents: write
  discussions: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      deployments: write
      contents: write
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          path: "."

      - name: Determine whether this run should publish a release
        id: release_tag
        run: |
          # shellcheck disable=SC2193
          # False positive: shellcheck's GitHub-expression placeholder
          # substitution makes the elif below look like a literal-vs-literal
          # comparison; github.ref is a real runtime value that can
          # legitimately match or not match the refs/tags/* glob.
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Publishing a release for tag ${TAG}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Build/validate only - not a release (no tag)"
          fi

      - name: Read pinned upstream AirConnect version
        id: upstream
        run: |
          {
            echo "version=$(jq -r .version upstream.json)"
            echo "tag=$(jq -r .tag upstream.json)"
            echo "asset=$(jq -r .asset upstream.json)"
            echo "sha256=$(jq -r .sha256 upstream.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Download pinned AirConnect release
        id: get_release
        uses: robinraju/release-downloader@v1.12
        with:
          repository: "philippe44/AirConnect"
          tag: ${{ steps.upstream.outputs.tag }}
          tarBall: false
          zipBall: false
          fileName: "AirConnect*.zip"
          out-file-path: "src/dsm7/bin"
          extract: true

      - name: Verify downloaded release checksum
        id: verify_checksum
        env:
          EXPECTED_SHA256: ${{ steps.upstream.outputs.sha256 }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_ASSET: ${{ steps.upstream.outputs.asset }}
        run: |
          # release-downloader with extract:true removes the archive after
          # unpacking, so re-fetch just the zip to checksum the exact bytes
          # GitHub served - this is what issue #107 would have caught before
          # a corrupted release shipped to users.
          curl -sL -o /tmp/verify.zip \
            "https://github.com/philippe44/AirConnect/releases/download/${UPSTREAM_TAG}/${UPSTREAM_ASSET}"
          ACTUAL_SHA256=$(sha256sum /tmp/verify.zip | awk '{print $1}')
          echo "expected: ${EXPECTED_SHA256}"
          echo "actual:   ${ACTUAL_SHA256}"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Checksum mismatch for AirConnect ${UPSTREAM_TAG} - refusing to build a release from this download. If upstream intentionally re-published this tag, update the sha256 in upstream.json after verifying the new contents yourself."
            exit 1
          fi
          rm -f /tmp/verify.zip

      - name: Validate downloaded Release
        id: validate_release
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          echo "Using AirConnect version '${UPSTREAM_TAG}' (pinned in upstream.json)"
          ls -ltR "${GITHUB_WORKSPACE}"/src/dsm7/bin/

      - name: Running shellcheck
        id: validate_code
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7; make shellcheck

      - name: Create packages of ALL architectures
        id: create_packages
        env:
          RELEASE_VERSION: ${{ steps.upstream.outputs.tag }}
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7; make build-all

      - name: Cleanup target
        id: clean_target
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7; make clean

      - name: Validate created packages (structure + ELF)
        id: validate_created_packages
        run: |
          ls -ltR "${GITHUB_WORKSPACE}"/src/dsm7/dist/
          FAIL=0
          for arch in arm arm-static armv5 armv5-static \
                      aarch64 aarch64-static x86 x86-static x86_64 x86_64-static \
                      powerpc powerpc-static; do
            # the trailing [0-9] anchors the version so e.g. "arm" doesn't
            # glob-match "arm-static"'s package too
            spk=$(find src/dsm7/dist -maxdepth 1 -name "AirConnect-dsm7-${arch}-[0-9]*.spk" 2>/dev/null | head -n1)
            if [ -z "$spk" ]; then
              echo "::error::No .spk found for arch ${arch}"
              FAIL=1
              continue
            fi
            echo "::group::Validating ${spk}"
            sh tests/validate_spk.sh "$spk" || FAIL=1
            workdir=$(mktemp -d)
            tar -xf "$spk" -C "$workdir"
            tar -xzf "$workdir/package.tgz" -C "$workdir"
            python3 tests/validate_elf.py --arch "${arch}" "$workdir/airupnp" "$workdir/aircast" || FAIL=1
            rm -rf "$workdir"
            echo "::endgroup::"
          done
          exit "$FAIL"

      - name: Creating GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            src/dsm7/dist/*.spk
          discussion_category_name: Releases
          body: |
            Packaging changes: see [CHANGELOG.md](https://github.com/eizedev/AirConnect-Synology/blob/master/CHANGELOG.md).
            Upstream AirConnect ${{ steps.upstream.outputs.tag }} changes: see the [AirConnect CHANGELOG](https://github.com/philippe44/AirConnect/blob/master/CHANGELOG).
          generate_release_notes: true
        if: steps.release_tag.outputs.is_release == 'true'

      - name: Upload releases to artifacts
        id: upload_releases
        uses: actions/upload-artifact@v7
        with:
          name: releases
          path: src/dsm7/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup dist
        id: clean_dist
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7; make clean-dist
