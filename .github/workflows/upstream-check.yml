---
name: Upstream AirConnect version bump

# Human-in-the-loop upstream update flow, three stages:
#   1. check-for-update: runs weekly, compares the pinned version in
#      upstream.json against philippe44/AirConnect's latest release. If
#      newer, computes the new checksum and opens a PR - never merges it.
#   2. tag: runs when a PR that touched upstream.json is merged to master
#      (by a human, reviewing and clicking merge on GitHub). Creates and
#      pushes the next release tag.
#   3. release: invokes release.yml directly as a reusable workflow (NOT by
#      relying on the tag push above to trigger it) in the same run, so it
#      builds, validates, and publishes. A tag pushed with the default
#      GITHUB_TOKEN does not trigger other workflows' `on: push: tags` -
#      GitHub suppresses that specifically to prevent recursive workflow
#      runs - so a direct workflow_call is what actually makes "merge the
#      PR" the only manual step, instead of silently publishing nothing.
#
# This intentionally never auto-merges the version-bump PR - a human
# reviews and merges it (see AirConnect-Synology project history: #106 and
# #107 both shipped real breakage that only surfaced after users installed
# it, so an unattended merge-and-publish pipeline is not worth the
# convenience here).

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [master]
    paths:
      - upstream.json

jobs:
  check-for-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compare upstream release to pinned version
        id: check
        env:
          # Passed via env instead of interpolated directly into the curl
          # command line, so the token never appears in a process listing
          # or in the script's own text (checkov CKV_GHA_3).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG=$(jq -r .tag upstream.json)
          LATEST=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/philippe44/AirConnect/releases/latest")
          LATEST_TAG=$(echo "$LATEST" | jq -r .tag_name)

          if [ "$LATEST_TAG" = "$CURRENT_TAG" ] || [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Already up to date (pinned: ${CURRENT_TAG}, upstream latest: ${LATEST_TAG:-unknown})."
            echo "update_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New upstream release: ${CURRENT_TAG} -> ${LATEST_TAG}"
          ASSET_URL=$(echo "$LATEST" | jq -r '[.assets[] | select(.name | test("^AirConnect-.*\\.zip$"))][0].browser_download_url')
          ASSET_NAME=$(basename "$ASSET_URL")
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "::error::Could not find an AirConnect-*.zip asset in the latest upstream release."
            exit 1
          fi

          curl -sL -o /tmp/upstream.zip "$ASSET_URL"
          SHA256=$(sha256sum /tmp/upstream.zip | awk '{print $1}')
          rm -f /tmp/upstream.zip

          jq -n --arg version "$LATEST_TAG" --arg tag "$LATEST_TAG" \
                --arg asset "$ASSET_NAME" --arg sha256 "$SHA256" \
            '{version: $version, tag: $tag, asset: $asset, sha256: $sha256}' \
            > upstream.json

          UPSTREAM_NOTES=$(echo "$LATEST" | jq -r '.body // "(no release notes provided upstream)"')

          {
            echo "Bumps the pinned upstream AirConnect version from"
            echo "\`${CURRENT_TAG}\` to \`${LATEST_TAG}\`"
            echo "in \`upstream.json\` (new SHA256 verified against the downloaded release asset)."
            echo
            echo "**This PR does not auto-merge.** Review the upstream changes below, merge"
            echo "manually when ready - merging will automatically tag and publish a new"
            echo "AirConnect-Synology release."
            echo
            echo "<details>"
            echo "<summary>Upstream release notes for ${LATEST_TAG}</summary>"
            echo
            echo "${UPSTREAM_NOTES}"
            echo
            echo "</details>"
            echo
            echo "Full upstream changelog: https://github.com/philippe44/AirConnect/blob/master/CHANGELOG"
          } > /tmp/pr_body.md

          {
            echo "update_available=true"
            echo "old_tag=${CURRENT_TAG}"
            echo "new_tag=${LATEST_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Open PR with the version bump
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Fixed branch name (no branch-suffix): re-running this workflow
          # before the PR is merged updates the same PR instead of piling
          # up a new one each week - unlike the images.yml workflow, which
          # does use a timestamp suffix and is why it has accumulated
          # several near-duplicate "Auto Compress Images" PRs.
          branch: upstream-airconnect-bump
          title: "chore(upstream): bump AirConnect to ${{ steps.check.outputs.new_tag }}"
          commit-message: "chore(upstream): bump pinned AirConnect to ${{ steps.check.outputs.new_tag }}"
          body-path: /tmp/pr_body.md

  tag:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Update CHANGELOG.md and push the next release tag
        id: create_tag
        run: |
          VERSION=$(jq -r .version upstream.json)
          TAG="${VERSION}-$(date +%Y%m%d)"
          RELEASE_DATE=$(date +%Y-%m-%d)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists - not pushing again. If this is a genuine same-day re-bump, tag manually with a disambiguating suffix."
            exit 1
          fi

          # Whatever accumulated under [Unreleased] (manual packaging-change
          # entries added since the last release) becomes this release's
          # section, same as a manual release. If nothing accumulated - the
          # common case for a pure upstream version bump with no packaging
          # script changes - fall back to a minimal generated note instead
          # of leaving the release without any CHANGELOG.md entry at all,
          # which is how this used to ship (a purely manual step that was
          # easy to forget for pure bumps).
          UNRELEASED_BODY=$(awk '/^## \[Unreleased\]/{f=1;next}/^## \[/{f=0}f' CHANGELOG.md)
          if [ -n "$(echo "$UNRELEASED_BODY" | tr -d '[:space:]')" ]; then
            STUB=""
          else
            STUB="Upstream AirConnect updated to ${VERSION}. See the [upstream CHANGELOG](https://github.com/philippe44/AirConnect/blob/master/CHANGELOG) for details."
          fi

          awk -v tag="$TAG" -v date="$RELEASE_DATE" -v stub="$STUB" '
            /^## \[Unreleased\]/ {
              print
              print ""
              print "## [" tag "] - " date
              if (stub != "") {
                print ""
                print stub
              }
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add release date to CHANGELOG for ${TAG}"
          git tag -a "$TAG" -m "AirConnect ${VERSION}"
          git push origin master "$TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed tag ${TAG} with CHANGELOG.md update."

  # Invokes release.yml directly (as a reusable workflow) instead of relying
  # on the tag push above to trigger it via `on: push: tags` - a push made
  # with the default GITHUB_TOKEN does not trigger other workflows (GitHub
  # suppresses that to prevent recursive runs), so that trigger alone would
  # silently never fire. This call happens in the same overall run instead.
  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
    # No secrets: - release.yml doesn't reference any secrets.* (it only
    # uses the automatic per-job GITHUB_TOKEN, which every job gets without
    # needing to inherit or pass anything). `secrets: inherit` would grant
    # it every repo secret unconditionally - unnecessary here regardless of
    # trust level, since it's a same-repo reusable workflow, not third-party.
    permissions:
      contents: write
      discussions: write
      packages: write
      deployments: write
      statuses: write
      actions: read
