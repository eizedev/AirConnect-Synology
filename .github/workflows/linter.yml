# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
permissions: read-all
jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write
      packages: read
      # To report GitHub Actions status checks
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "master"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ruff's own formatter and Black are both enabled by default and
          # disagree on some edge cases (super-linter's own docs warn about
          # running both) - Black already covers formatting, ruff (lint)
          # stays on separately.
          VALIDATE_PYTHON_RUFF_FORMAT: false
          # Biome targets JS/TS/CSS/etc., none of which this repo has; the
          # only file it actually touches is JSON, already covered by
          # JSON_PRETTIER, so it's pure redundant noise here.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Both findings jscpd reports are duplication by design, not
          # copy-paste bugs: src/dsm and src/dsm7 are separate package
          # generations that intentionally share most of their logic, and
          # the ISSUE_TEMPLATE files are near-duplicates on purpose.
          VALIDATE_JSCPD: false
          # shfmt only disagrees with this repo's established 4-space
          # shell indentation (it wants tabs); actual shell correctness is
          # already covered by GITHUB_ACTIONS/shellcheck and `make
          # shellcheck` in release.yml, so this is pure style noise.
          VALIDATE_SHELL_SHFMT: false
          # checkov and zizmor both raised one genuinely useful finding
          # each earlier (a secret interpolated into a curl command line,
          # a template-injection risk) - both already fixed in code. The
          # "actions pinned by tag rather than commit SHA" finding they
          # both also raised is no longer a live issue either - every
          # third-party action is now SHA-pinned (see the individual uses:
          # lines below). What's left is repo-wide policy noise unrelated
          # to any given branch (combined write permissions a
          # PR-automation job genuinely needs): a real question, but a
          # considered policy choice, not a bug, and not worth a config
          # file per tool to keep suppressing.
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          # Flags correctly-spelled words against a fixed house-style
          # dictionary unrelated to this repo (e.g. wants "trade-off" over
          # "tradeoff", lowercase "readme" over the actual filename
          # "README") - not a spelling or grammar check, just a style
          # opinion with no config file in this repo to tune it. Actual
          # spelling is already covered separately by SPELL_CODESPELL.
          VALIDATE_NATURAL_LANGUAGE: false
