---
name: Lint Code Base

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  run-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history is needed so super-linter can diff against DEFAULT_BRANCH
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Code Base
        uses: super-linter/super-linter@v8.3.1
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allowlist only linters that apply to this shell/SPK repo.
          # Setting any VALIDATE_* to true disables the rest, including
          # Biome, Prettier, textlint, JSCPD, and zizmor from v8 defaults.
          VALIDATE_BASH: true
          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
