name: "Close stale issues and PR"
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read # only for delete-branch option
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          stale-issue-message: "This issue is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 5 days."
          stale-pr-message: "This PR is stale because it has been open 45 days with no activity. Remove stale label or comment to keep it open - stale PRs are not closed automatically."
          close-issue-message: "This issue was closed because it has been stalled for 5 days with no activity."
          stale-issue-label: "no-issue-activity"
          # upstream: waiting on philippe44 is exactly the state that produces
          # months of silence through nobody's fault, and closing those loses
          # the thread on the work that takes longest.
          exempt-issue-labels: "awaiting-approval,work-in-progress,breaking-change,upstream"
          stale-pr-label: "no-pr-activity"
          days-before-stale: 30
          days-before-close: 5
          days-before-pr-close: -1
