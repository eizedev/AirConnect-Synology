# See https://github.com/actions/labeler for the config schema.
#
# The previous version of this file nested `any-glob-to-any-file` and
# `all-globs-to-all-files` as two separate list items under `changed-files:`
# for the same label (meant to express "matches X, except under Y") - but
# list items under `changed-files:` are OR'd together, not AND'd, so the
# "all-globs-to-all-files: '!some/excluded/path/*'" branch (true for
# virtually every PR, since it only requires that path to be untouched)
# ended up satisfying the label on its own, independent of whether the
# intended `any-glob-to-any-file` pattern actually matched. Every PR got
# every label regardless of what it touched. Each label below now uses a
# single condition instead of trying to express an exclusion.

documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

dsm7:
  - changed-files:
      - any-glob-to-any-file: "src/dsm7/**"

dsm6:
  - changed-files:
      - any-glob-to-any-file: "src/dsm/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**"
